
<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIAN - PDF Library</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #202944;
    }
    header {
      background: #172554;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #dbeafe; }
    main {
      max-width: 760px;
      margin: 24px auto;
      padding: 0 14px;
    }
    .panel {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #17255412;
    }
    input, select {
      width: 100%;
      padding: 13px;
      margin: 8px 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }
    .book {
      background: white;
      margin-top: 14px;
      padding: 18px;
      border-radius: 12px;
      border-left: 4px solid #2563eb;
    }
    .book h3 { margin: 0 0 8px; }
    .muted { color: #64748b; font-size: 14px; }
    footer {
      text-align: center;
      padding: 24px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>📚 ARIAN</h1>
    <p>PDF Library — စာအုပ်များ၏ ကမ္ဘာ</p>
  </header>

  <main>
    <section class="panel">
      <h2>စာအုပ်ရှာဖွေရန်</h2>
      <input id="search" type="search"
        placeholder="စာအုပ်အမည်၊ စာရေးသူ ရှာရန်...">
      <select id="category">
        <option value="">အမျိုးအစားအားလုံး</option>
        <option value="မြန်မာစာပေ">မြန်မာစာပေ</option>
        <option value="သမိုင်း">သမိုင်း</option>
        <option value="ဝတ္ထု">ဝတ္ထု</option>
        <option value="အခြား">အခြား</option>
      </select>
      <p class="muted">
        စာအုပ်များကို အတည်ပြုပြီးမှသာ စာဖတ်သူများထံ ပြသပေးမည်။
      </p>
    </section>

    <section id="books" aria-live="polite">
      <div class="book">
        <h3>ARIAN PDF Library မှ ကြိုဆိုပါသည်</h3>
        <p>စာအုပ်စာရင်းကို Database နှင့် ချိတ်ဆက်ပြီးနောက်
        ဤနေရာတွင် ဖော်ပြပေးပါမည်။</p>
        <p class="muted">စာအုပ်များ မကြာမီ ထည့်သွင်းပေးပါမည်။</p>
      </div>
    </section>
  </main>

  <footer>© ARIAN PDF Library</footer>
</body>
</html>
